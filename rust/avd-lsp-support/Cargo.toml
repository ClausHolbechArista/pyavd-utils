[package]
name = "avd-lsp-support"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Stable pyavd-utils API and feature boundary for the AVD language server"

[lints]
workspace = true

[dependencies]
avdschema = { path = "../avdschema", default-features = false }
validation = { path = "../validation", default-features = false }
yaml-parser = { path = "../yaml-parser", default-features = false, features = [
    "avdschema-core",
    "serde",
] }

[features]
default = []
gzip = ["avdschema/gzip"]
