[package]
name = "json-parser"
version.workspace = true
edition = "2024"
license.workspace = true
description = "A JSON parser with error recovery, span tracking, and optional serde support"
repository = "https://github.com/aristanetworks/pyavd-utils"
keywords = ["json", "parser", "error-recovery", "span"]
categories = ["parsing", "text-processing"]

[dependencies]
derive_more = { workspace = true, features = ["display"] }
serde = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"
serde_json = { workspace = true, features = ["arbitrary_precision", "preserve_order"] }

[features]
default = []
serde = ["dep:serde"]

[[bench]]
name = "parser_bench"
harness = false

[lints]
workspace = true
