[package]
name = "validation"
version.workspace = true
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
avdschema = { path = "../avdschema", default-features = false }
mmap-guard = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["display", "from"] }
log = { workspace = true }
rkyv = { workspace = true, optional = true }
self_cell = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [
    "arbitrary_precision", # To support very big numbers
    "preserve_order",
] }
yaml-parser = { path = "../yaml-parser", default-features = false, features = ["avdschema-core"] }

[features]
default = ["gzip", "regex-perf", "yaml"]
gzip = ["avdschema/gzip"]
regex-perf = ["avdschema/regex-perf"]
yaml = ["avdschema/yaml"]
archive = ["dep:mmap-guard", "dep:rkyv", "dep:self_cell", "avdschema/mmap"]

[dev-dependencies]
ordermap = { workspace = true, features = ["serde"] }
tempfile = "3.23.0"

[lib]
crate-type = ["cdylib", "lib"]
